plugins {
    id('java')
    id('maven-publish')
}

group = 'com.kyant'
version = '2026.1'

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation('androidx.annotation:annotation:1.10.0')
    implementation('com.google.errorprone:error_prone_annotations:2.49.0')
}

afterEvaluate {
    publishing {
        publications {
            maven(MavenPublication) {
                groupId = 'com.kyant'
                artifactId = 'm3color'
                version = '2026.1'
                from components.java
            }
        }
    }
}
